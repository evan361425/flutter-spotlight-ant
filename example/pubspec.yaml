name: flutter_test_example
description: A Flutter Package (Demo) to render spotlight_ant.
homepage: https://github.com/evan361425/flutter-spotlight-ant

version: 1.0.0+1

publish_to: "none"

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  fluttertoast: ^9.1.0
  flutter:
    sdk: flutter
  spotlight_ant:
    path: ../
  url_launcher: ^6.3.2
  url_strategy: ^0.3.0
  go_router: ^17.3.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
  - assets/spotlight-ant.png
